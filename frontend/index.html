<!DOCTYPE html>
<html lang="en">
<head>

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%236E56CF'/><stop offset='1' stop-color='%233E63DD'/></linearGradient></defs><rect width='32' height='32' rx='9' fill='url(%23g)'/><path d='M10 9h8l4 4v10H10z' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/><path d='m13 17 2.5 2.5L20 15' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/></svg>">

<link rel="stylesheet" href="/assets/styles.css">
<script>
  try { var t = localStorage.getItem('ri2-theme');
    if (localStorage.getItem('ri2-collapsed') === '1') document.documentElement.classList.add('pre-collapsed');
    if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.setAttribute('data-theme', 'dark');
  } catch (e) { }
</script>
</head>
<body>
<div class="shell" id="shell">
  <aside class="side" aria-label="Main navigation">
    <div class="logo">
      <span class="logo-mark"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h7l4 4v12H7z"/><path d="m10 13 2 2 3.5-3.5"/></svg></span>
      <span>Resume Intelligence<small>Demo workspace</small></span>
    </div>
    <button class="side-search" data-act="palette" aria-label="Search or jump to (Ctrl K)"><i data-icon="search" data-size="15"></i><span>Search or jump to…</span><span class="kbd" id="kbd-k">Ctrl K</span></button>
    <div class="nav-label">Hiring</div>
    <nav class="nav" id="nav">
      <a href="#/overview" data-r="overview" data-tip-side="Overview"><i data-icon="overview"></i><span>Overview</span></a>
      <a href="#/jobs" data-r="jobs" data-tip-side="Job library"><i data-icon="folder"></i><span>Job library</span><span class="tag" id="nav-jobs"></span></a>
      <a href="#/screen" data-r="screen" data-tip-side="Screen candidates"><i data-icon="users"></i><span>Screen candidates</span><span class="tag" id="nav-screen"></span></a>
      <a href="#/improve" data-r="improve" data-tip-side="Improve a resume"><i data-icon="wand"></i><span>Improve a resume</span></a>
    </nav>
    <div class="nav-label">Model</div>
    <nav class="nav">
      <a href="#/model" data-r="model" data-tip-side="Model quality"><i data-icon="shield"></i><span>Model quality</span><span class="tag live" id="nav-model"></span></a>
      <a href="#/method" data-r="method" data-tip-side="How scoring works"><i data-icon="scale"></i><span>How scoring works</span></a>
    </nav>

      <div class="privacy"><i data-icon="lock" data-size="16"></i><div><b>Resumes are never stored</b>They are read in memory and discarded. Only your job library is saved.</div></div>
      <div class="side-tools">
        <span class="tiny">v2.2 · fictional data</span>
        <button class="icon-btn" data-act="shortcuts" title="Keyboard shortcuts (?)" aria-label="Keyboard shortcuts"><i data-icon="keyboard" data-size="17"></i></button>

        <button class="icon-btn collapse-btn" data-act="collapse" title="Collapse sidebar ([)" aria-label="Collapse sidebar"><i data-icon="chevronLeft" data-size="17"></i></button>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="top" id="top">
      <button class="icon-btn only-mobile" id="menu" aria-label="Open menu"><i data-icon="menu"></i></button>
      <div class="crumbs" id="crumbs"></div>
      <div class="spacer"></div>
      <div class="row" id="top-actions"></div>
      <div class="top-tools">
        <button class="icon-btn" data-act="palette" title="Search or jump to (Ctrl K)" aria-label="Search"><i data-icon="search" data-size="17"></i></button>

</div>
