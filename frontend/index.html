<script>

<body>
<div class="shell" id="shell">
  <aside class="side">
    <div class="logo">
      <span class="logo-mark"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h7l4 4v12H7z"/><path d="m10 13 2 2 3.5-3.5"/></svg></span>
      <span>Resume Intelligence<small>Hiring decisions with reasons</small></span>
    </div>
    <div class="nav-label">Workspace</div>
    <nav class="nav" id="nav">
      <a href="#/screen" data-r="screen"><i data-icon="users"></i>Screen candidates<span class="tag">Recruiter</span></a>
      <a href="#/improve" data-r="improve"><i data-icon="wand"></i>Improve a resume<span class="tag">Candidate</span></a>
    </nav>
    <div class="nav-label">Learn</div>
    <nav class="nav">
      <a href="#/method" data-r="method"><i data-icon="scale"></i>How scoring works</a>

    <div class="page" id="page"></div>
  </main>
</div>
<div id="tipbox" class="tipbox" hidden></div>
<input type="file" id="file-multi" accept=".pdf,.docx,.txt,.md" multiple hidden>
